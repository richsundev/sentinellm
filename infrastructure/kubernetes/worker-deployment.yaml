apiVersion: apps/v1
kind: Deployment
metadata:
  name: sentinel-worker
  namespace: sentinellm
  labels: { app: sentinel-worker }
spec:
  replicas: 2
  selector:
    matchLabels: { app: sentinel-worker }
  template:
    metadata:
      labels: { app: sentinel-worker }
    spec:
      containers:
        - name: worker
          image: ghcr.io/OWNER/sentinellm-worker:latest
          envFrom:
            - configMapRef: { name: sentinel-config }
            - secretRef: { name: sentinel-secrets }
          resources:
            requests: { cpu: "100m", memory: "256Mi" }
            limits: { cpu: "1", memory: "512Mi" }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: sentinel-worker
  namespace: sentinellm
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: sentinel-worker
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 75 }
  # A queue-depth-based scaling metric (via a Prometheus adapter watching
  # sentinel_queue_depth) would react to burst evaluation backlogs far
  # faster than CPU utilization — noted as a follow-up in
  # infrastructure/kubernetes/README.md rather than implemented here, since
  # it requires a metrics-server + custom-metrics-adapter this repo doesn't
  # ship.
