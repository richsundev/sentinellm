apiVersion: apps/v1
kind: Deployment
metadata:
  name: sentinel-worker
  namespace: sentinellm
  labels: { app: sentinel-worker }
spec:
  replicas: 2
  selector:
    matchLabels: { app: sentinel-worker }
  template:
    metadata:
      labels: { app: sentinel-worker }
      # Pod-annotation scrape discovery (the common Prometheus Kubernetes
      # convention) — every replica serves its own /metrics on 9100.
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9100"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: worker
          image: ghcr.io/OWNER/sentinellm-worker:latest
          ports:
            - name: metrics
              containerPort: 9100
          # The metrics server starts before any loop, so this only proves the
          # process is up — per-loop staleness is what the
          # SentinelWorkerLoopStalled alert is for.
          livenessProbe:
            httpGet: { path: /metrics, port: metrics }
            initialDelaySeconds: 15
            periodSeconds: 20
          envFrom:
            - configMapRef: { name: sentinel-config }
            - secretRef: { name: sentinel-secrets }
          resources:
            requests: { cpu: "100m", memory: "256Mi" }
            limits: { cpu: "1", memory: "512Mi" }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: sentinel-worker
  namespace: sentinellm
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: sentinel-worker
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 75 }
  # A queue-depth-based scaling metric would react to burst evaluation
  # backlogs far faster than CPU utilization. The worker now exports
  # `sentinel_queue_depth`; what's still missing is the prometheus-adapter
  # rule that turns it into a custom metric for this HPA — noted in
  # infrastructure/kubernetes/README.md rather than implemented here, since
  # it needs a custom-metrics adapter this repo doesn't ship.
  #
  # Scaling out is safe with respect to the periodic loops: each pass takes a
  # Postgres advisory lock (docs/design-decisions.md, decision 12), so extra
  # replicas add evaluation throughput without double-applying a rollout step.
