# Single-replica in-cluster Postgres for demo/dev clusters. A real
# deployment should use a managed database (RDS/Cloud SQL/etc.) or an
# operator (CloudNativePG, Zalando postgres-operator) for HA, backups, and
# failover — see infrastructure/kubernetes/README.md.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: sentinellm
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels: { app: postgres }
  template:
    metadata:
      labels: { app: postgres }
    spec:
      containers:
        - name: postgres
          # pinned by digest — re-resolve with
          # `docker pull postgres:16-alpine && docker inspect --format='{{index .RepoDigests 0}}' postgres:16-alpine`
          image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
          ports: [{ containerPort: 5432 }]
          env:
            - name: POSTGRES_USER
              value: sentinel
            - name: POSTGRES_DB
              value: sentinellm
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: sentinel-secrets, key: POSTGRES_PASSWORD }
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "sentinel", "-d", "sentinellm"] }
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests: { cpu: "100m", memory: "256Mi" }
            limits: { cpu: "500m", memory: "512Mi" }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: ["ReadWriteOnce"]
        resources: { requests: { storage: 5Gi } }
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: sentinellm
spec:
  selector: { app: postgres }
  ports: [{ port: 5432, targetPort: 5432 }]
