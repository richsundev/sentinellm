x-backend-env: &backend-env
  SENTINEL_ENV: local
  SENTINEL_LOG_LEVEL: INFO
  SENTINEL_SECRET_KEY: ${SENTINEL_SECRET_KEY:-local-dev-secret-change-me}
  SENTINEL_DATABASE_URL: postgresql+psycopg://sentinel:sentinel@postgres:5432/sentinellm
  SENTINEL_REDIS_URL: redis://redis:6379/0
  SENTINEL_LLM_PROVIDER: ${SENTINEL_LLM_PROVIDER:-mock}
  SENTINEL_EMBEDDING_PROVIDER: ${SENTINEL_EMBEDDING_PROVIDER:-mock}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  SENTINEL_CACHE_ENABLED: "true"
  SENTINEL_ALERT_WEBHOOK_URL: http://api:8000/api/v1/_mock_webhook
  SENTINEL_DEMO_API_KEY: ${SENTINEL_DEMO_API_KEY:-demo-api-key}

services:
  postgres:
    # postgres:16-alpine, pinned by digest — re-resolve with
    # `docker pull postgres:16-alpine && docker inspect --format='{{index .RepoDigests 0}}' postgres:16-alpine`
    image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    environment:
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: sentinel
      POSTGRES_DB: sentinellm
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel -d sentinellm"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    # redis:7-alpine, pinned by digest — re-resolve with
    # `docker pull redis:7-alpine && docker inspect --format='{{index .RepoDigests 0}}' redis:7-alpine`
    image: redis:7-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
    environment:
      <<: *backend-env
    depends_on:
      postgres:
        condition: service_healthy
    command: ["alembic", "upgrade", "head"]
    restart: "no"

  seed:
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
    environment:
      <<: *backend-env
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    command: ["python", "scripts/seed_demo.py"]
    restart: "no"

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
    environment:
      <<: *backend-env
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    build:
      context: .
      dockerfile: infrastructure/docker/worker.Dockerfile
    environment:
      <<: *backend-env
    # Serves its own Prometheus metrics on :9100 (not published to the host, so
    # `--scale worker=N` doesn't collide on a port; Prometheus scrapes it over
    # the compose network).
    expose:
      - "9100"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9100/metrics', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
        NEXT_PUBLIC_API_KEY: ${SENTINEL_DEMO_API_KEY:-demo-api-key}
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_API_KEY: ${SENTINEL_DEMO_API_KEY:-demo-api-key}
    ports:
      - "3000:3000"
    depends_on:
      - api

  # ---- Optional monitoring stack: `docker compose --profile monitoring up` ----
  prometheus:
    profiles: ["monitoring"]
    # prom/prometheus:v3.5.0, pinned by digest — re-resolve with
    # `docker pull prom/prometheus:v3.5.0 && docker inspect --format='{{index .RepoDigests 0}}' prom/prometheus:v3.5.0`
    image: prom/prometheus@sha256:63805ebb8d2b3920190daf1cb14a60871b16fd38bed42b857a3182bc621f4996
    volumes:
      - ./infrastructure/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infrastructure/monitoring/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - api

  grafana:
    profiles: ["monitoring"]
    # grafana/grafana:12.1.0, pinned by digest — re-resolve with
    # `docker pull grafana/grafana:12.1.0 && docker inspect --format='{{index .RepoDigests 0}}' grafana/grafana:12.1.0`
    image: grafana/grafana@sha256:6ac590e7cabc2fbe8d7b8fc1ce9c9f0582177b334e0df9c927ebd9670469440f
    environment:
      # Local demo only: anonymous read-only access so the dashboard opens
      # without a login. Admin login is admin / admin (change it for anything
      # beyond localhost).
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/sentinellm.json
    volumes:
      - ./infrastructure/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infrastructure/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3001:3000"
    depends_on:
      - prometheus

volumes:
  pgdata:
