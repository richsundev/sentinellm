x-backend-env: &backend-env
  SENTINEL_ENV: local
  SENTINEL_LOG_LEVEL: INFO
  SENTINEL_SECRET_KEY: ${SENTINEL_SECRET_KEY:-local-dev-secret-change-me}
  SENTINEL_DATABASE_URL: postgresql+psycopg://sentinel:sentinel@postgres:5432/sentinellm
  SENTINEL_REDIS_URL: redis://redis:6379/0
  SENTINEL_LLM_PROVIDER: ${SENTINEL_LLM_PROVIDER:-mock}
  SENTINEL_EMBEDDING_PROVIDER: ${SENTINEL_EMBEDDING_PROVIDER:-mock}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  SENTINEL_CACHE_ENABLED: "true"
  SENTINEL_ALERT_WEBHOOK_URL: http://api:8000/api/v1/_mock_webhook
  SENTINEL_DEMO_API_KEY: ${SENTINEL_DEMO_API_KEY:-demo-api-key}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: sentinel
      POSTGRES_DB: sentinellm
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel -d sentinellm"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
    environment:
      <<: *backend-env
    depends_on:
      postgres:
        condition: service_healthy
    command: ["alembic", "upgrade", "head"]
    restart: "no"

  seed:
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
    environment:
      <<: *backend-env
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    command: ["python", "scripts/seed_demo.py"]
    restart: "no"

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
    environment:
      <<: *backend-env
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    build:
      context: .
      dockerfile: infrastructure/docker/worker.Dockerfile
    environment:
      <<: *backend-env
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
        NEXT_PUBLIC_API_KEY: ${SENTINEL_DEMO_API_KEY:-demo-api-key}
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_API_KEY: ${SENTINEL_DEMO_API_KEY:-demo-api-key}
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  pgdata:
