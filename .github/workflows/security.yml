name: security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # weekly, Monday 06:00 UTC

jobs:
  python-dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - run: uv python install 3.12

      - name: Create venv and install
        run: |
          uv venv .venv
          uv pip install -e ".[dev]" --python .venv/bin/python
          uv pip install pip-audit --python .venv/bin/python

      - name: pip-audit (known-CVE scan of resolved dependencies)
        run: .venv/bin/pip-audit --strict || true
        # `|| true`: this is a visibility gate (findings are printed in the
        # job log), not a hard release blocker — flip this once the project
        # has a documented triage/exception process for transitive
        # advisories with no upstream fix yet. See docs/security.md.

  frontend-dependency-audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: npm audit (fail only on high/critical)
        run: npm audit --audit-level=high

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Scan for committed secrets (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
