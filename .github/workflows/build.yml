name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  docker-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: api
            dockerfile: infrastructure/docker/api.Dockerfile
            context: .
          - name: worker
            dockerfile: infrastructure/docker/worker.Dockerfile
            context: .
          - name: frontend
            dockerfile: frontend/Dockerfile
            context: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.name }} image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: false
          tags: sentinellm-${{ matrix.name }}:ci
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  compose-smoke-test:
    runs-on: ubuntu-latest
    needs: docker-build
    steps:
      - uses: actions/checkout@v4

      - name: Start the full stack
        run: docker compose up --build -d

      - name: Wait for API health
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/health; then exit 0; fi
            sleep 3
          done
          echo "API did not become healthy in time"
          docker compose logs
          exit 1

      - name: Verify seed data landed
        run: |
          curl -sf -H "X-API-Key: demo-api-key" \
            "http://localhost:8000/api/v1/metrics/overview?range=24h" | grep -qE '"request_volume":[1-9][0-9]*'

      - name: Verify frontend responds
        run: curl -sf -o /dev/null http://localhost:3000/overview

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down -v
