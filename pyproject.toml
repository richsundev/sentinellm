[project]
name = "sentinellm"
version = "0.1.0"
description = "Autonomous LLM Reliability, Evaluation & Optimization Platform"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "SentinelLLM Contributors" }]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "sqlalchemy>=2.0.35",
    "alembic>=1.13.3",
    "asyncpg>=0.29.0",
    "psycopg[binary]>=3.2.0",
    "redis>=5.0.8",
    "httpx>=0.27.0",
    "structlog>=24.4.0",
    "opentelemetry-api>=1.27.0",
    "opentelemetry-sdk>=1.27.0",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.27.0",
    "prometheus-client>=0.21.0",
    "numpy>=1.26.0",
    "tenacity>=9.0.0",
    "python-multipart>=0.0.9",
    "limits>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.9",
    "mypy>=1.11.2",
    "aiosqlite>=0.20.0",
    "respx>=0.21.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sentinellm"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]
# Alembic autogenerates versions/*.py from a template we don't hand-edit;
# holding it to the same lint bar as authored code isn't meaningful.
extend-exclude = ["src/sentinellm/db/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]
# E501: line length is enforced only loosely in this project (docstrings/URLs).
# B008: `Depends(...)` as an argument default is FastAPI's documented, idiomatic
#   dependency-injection pattern, not the mutable-default footgun B008 targets.
# UP046: Pydantic generic response models (`Page[T]`) still use `typing.Generic`
#   deliberately — this is the pattern the FastAPI/Pydantic docs use for
#   response_model generics; the PEP 695 form has rough edges there.
ignore = ["E501", "B008", "UP046"]

[tool.mypy]
python_version = "3.12"
packages = ["sentinellm"]
mypy_path = "src"
ignore_missing_imports = true
disallow_untyped_defs = false
warn_unused_ignores = true
exclude = ["tests/", "scripts/"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["sentinellm"]
# SQLAlchemy's async engine bridges to sync drivers via the `greenlet`
# library (`greenlet_spawn`). Without this, coverage.py's tracer doesn't
# follow execution across that greenlet switch, so every DB-query-heavy
# async function reports as largely "uncovered" even when tests genuinely
# exercise it end-to-end — this isn't a testing gap, it's a measurement gap.
concurrency = ["greenlet", "thread"]
